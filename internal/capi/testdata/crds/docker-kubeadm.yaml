# Synthetic CAPD (docker) and kubeadm CRDs at the v1beta2 contract. KubeadmControlPlane
# references its machine template the contract way (machineTemplate.spec.infrastructureRef).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dockerclusters.infrastructure.cluster.x-k8s.io
  labels:
    cluster.x-k8s.io/provider: infrastructure-docker
    cluster.x-k8s.io/v1beta1: v1beta1
    cluster.x-k8s.io/v1beta2: v1beta2
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    kind: DockerCluster
    listKind: DockerClusterList
    plural: dockerclusters
    singular: dockercluster
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: false
    - name: v1beta2
      served: true
      storage: true
---
apiVersion: apiextensions.k8s.io/v1
