apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kubeadmcontrolplanes.controlplane.cluster.x-k8s.io
  labels:
    cluster.x-k8s.io/provider: control-plane-kubeadm
    cluster.x-k8s.io/v1beta1: v1beta1
    cluster.x-k8s.io/v1beta2: v1beta2
spec:
  group: controlplane.cluster.x-k8s.io
  names:
    kind: KubeadmControlPlane
    listKind: KubeadmControlPlaneList
    plural: kubeadmcontrolplanes
    singular: kubeadmcontrolplane
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: false
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                machineTemplate:
                  type: object
                  properties:
                    infrastructureRef:
                      type: object
                      properties:
                        apiVersion: { type: string }
                        kind: { type: string }
                        name: { type: string }
                        namespace: { type: string }
    - name: v1beta2
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                machineTemplate:
                  type: object
                  properties:
                    spec:
                      type: object
                      properties:
                        infrastructureRef:
                          type: object
                          properties:
                            apiGroup: { type: string }
                            kind: { type: string }
                            name: { type: string }
---
