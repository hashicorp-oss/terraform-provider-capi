                              NOTE: NodeDrainTimeoutSeconds is different from `kubectl
                              drain --timeout`.'
                            format: int32
                            minimum: 0
                            type: integer
                          nodeVolumeDetachTimeoutSeconds:
                            description: 'NodeVolumeDetachTimeoutSeconds is the total
                              amount of time, in seconds, that the controller

                              will spend waiting for all volumes to be detached. The
                              default value is 0, meaning that the

