# ClusterClass mode for the same Tinkerbell + Talos input as direct-tinkerbell-talos:
# templates first, then the ClusterClass, then a Cluster with spec.topology.
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: TinkerbellClusterTemplate
metadata:
  labels:
    cluster.x-k8s.io/cluster-name: acc
  name: acc-f2dd8b38
  namespace: capi
spec:
  template:
    spec:
      templateInline: |
        version: "0.1"
        name: talos
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: TalosControlPlaneTemplate
metadata:
  labels:
    cluster.x-k8s.io/cluster-name: acc
  name: acc-control-plane-d34741c4
  namespace: capi
spec:
  template:
    spec:
      controlPlaneConfig:
        controlplane:
          generateType: controlplane
          strategicPatches:
            - |
              machine:
                install:
                  disk: /dev/sda
          talosVersion: v1.13
      rolloutStrategy:
        type: OnDelete
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: TinkerbellMachineTemplate
metadata:
  labels:
    cluster.x-k8s.io/cluster-name: acc
  name: acc-control-plane-06d80c2f
  namespace: capi
spec:
  template:
    spec:
      hardwareAffinity:
        required:
          - labelSelector:
              matchLabels:
                type: cp
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: TinkerbellMachineTemplate
metadata:
  labels:
    cluster.x-k8s.io/cluster-name: acc
  name: acc-md-0-6d0c2ca9
  namespace: capi
spec:
  template:
    spec:
      hardwareAffinity:
        required:
          - labelSelector:
              matchLabels:
                type: worker
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: TalosConfigTemplate
metadata:
  labels:
    cluster.x-k8s.io/cluster-name: acc
  name: acc-md-0-8d41c84e
  namespace: capi
spec:
  template:
    spec:
      generateType: worker
      talosVersion: v1.13
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: TinkerbellMachineTemplate
metadata:
  labels:
    cluster.x-k8s.io/cluster-name: acc
  name: acc-gpu-9e458ff9
  namespace: capi
spec:
  template:
    spec: {}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: TalosConfigTemplate
metadata:
  labels:
    cluster.x-k8s.io/cluster-name: acc
  name: acc-gpu-865d8919
  namespace: capi
spec:
  template:
    spec:
      generateType: worker
      talosVersion: v1.14
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  labels:
    cluster.x-k8s.io/cluster-name: acc
  name: acc
  namespace: capi
spec:
  controlPlane:
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: TinkerbellMachineTemplate
        name: acc-control-plane-06d80c2f
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta1
      kind: TalosControlPlaneTemplate
      name: acc-control-plane-d34741c4
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: TinkerbellClusterTemplate
      name: acc-f2dd8b38
  workers:
    machineDeployments:
      - bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
            kind: TalosConfigTemplate
            name: acc-md-0-8d41c84e
        class: md-0
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: TinkerbellMachineTemplate
            name: acc-md-0-6d0c2ca9
      - bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
            kind: TalosConfigTemplate
            name: acc-gpu-865d8919
        class: gpu
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: TinkerbellMachineTemplate
            name: acc-gpu-9e458ff9
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  labels:
    cluster.x-k8s.io/cluster-name: acc
  name: acc
  namespace: capi
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.244.0.0/16
    serviceDomain: cluster.local
    services:
      cidrBlocks:
        - 10.96.0.0/12
  controlPlaneEndpoint:
    host: 10.0.0.160
    port: 6443
  topology:
    classRef:
      name: acc
    controlPlane:
      replicas: 1
    version: v1.34.0
    workers:
      machineDeployments:
        - class: md-0
          failureDomain: rack-1
          metadata:
            annotations:
              note: x
            labels:
              tier: worker
          name: md-0
          replicas: 2
        - class: gpu
          name: gpu
          replicas: 1
