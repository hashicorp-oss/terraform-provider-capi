# Terraform Provider testing workflow.
name: CI/CD

# This GitHub action runs your tests for each pull request and push.
on:
  pull_request:
    paths:
    - "**.go"
    - "go.mod"
    - "go.sum"
    - "examples/**"
    - "templates/**"
    - ".github/workflows/ci.yaml"
  push:
    branches:
    - "main"
    paths:
    - "**.go"
    - "go.mod"
    - "go.sum"
    - "examples/**"
    - "templates/**"
    - ".github/workflows/ci.yaml"

# contents: read is needed to check out the repository.
permissions:
  contents: read

jobs:
  lint:
    name: GolangCI Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          # The action tracks golangci-lint `latest`, so new checks can appear
          # without any code change and flag pre-existing debt. Gate PRs on the
          # issues they actually introduce; pre-existing findings are paid down
          # separately rather than blocking every PR.
          only-new-issues: true

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: "go.mod"
        cache: true
    - run: go mod download
    - run: go build -v .

  generate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: "go.mod"
        cache: true
    # tfplugindocs formats the examples with the Terraform CLI.
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      with:
        terraform_wrapper: false
    - run: go generate ./...
    - name: git diff
      run: |
        git diff --compact-summary --exit-code || \
          (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: "go.mod"
        cache: true
    - run: go mod download

    - name: Unit tests
      if: always()
      # -race requires cgo; the coverage profile is uploaded below.
      run: go tool gotestsum --junitfile junit.xml -- -coverprofile=coverage.txt -covermode=atomic -race -count=1 -timeout 30m -v ./...
      env:
        CGO_ENABLED: "1"

    - name: Generate HTML coverage report
      if: always()
      run: go tool cover -html=coverage.txt -o coverage.html

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: |
          coverage.txt
          coverage.html
          junit.xml
