# Starter clusterctl template for Tinkerbell infrastructure with the Talos
# bootstrap and control-plane providers. Provider releases only ship a kubeadm
# template, so point capi_cluster at this file:
#
#   template = {
#     source    = "${path.module}/cluster-template-talos.yaml"
#     variables = { CONTROL_PLANE_VIP = "192.168.1.100" }
#   }
#
# Variables (clusterctl sets CLUSTER_NAME, NAMESPACE, KUBERNETES_VERSION,
# CONTROL_PLANE_MACHINE_COUNT and WORKER_MACHINE_COUNT from the resource):
#
#   CONTROL_PLANE_VIP   required  Shared Talos VIP for the API server.
#   TALOS_VERSION       v1.13     Talos machine-config version (major.minor).
#   TALOS_INSTALL_DISK  /dev/sda  Disk the Talos image is streamed to.
#   TALOS_IMAGE_URL     factory   Talos metal raw image the Tinkerbell workflow
#                                 streams to disk. Use an Image Factory schematic
#                                 whose extraKernelArgs include
#                                 talos.config=http://<hegel>:50061/2009-04-04/user-data
#                                 so the node fetches the CAPI machine config
#                                 (CAPT writes it to the Hardware userdata).
#   POD_CIDR / SERVICE_CIDR       Talos defaults.
#
# CAPT replaces the literal string PROVIDER_ID in the bootstrap data with the
# Tinkerbell provider ID, which is why it appears in the kubelet extra args.
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: "${CLUSTER_NAME}"
spec:
  controlPlaneEndpoint:
    host: "${CONTROL_PLANE_VIP}"
    port: 6443
  clusterNetwork:
    pods:
      cidrBlocks:
        - ${POD_CIDR:=10.244.0.0/16}
    services:
      cidrBlocks:
        - ${SERVICE_CIDR:=10.96.0.0/12}
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
    kind: TinkerbellCluster
    name: "${CLUSTER_NAME}"
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: TalosControlPlane
    name: "${CLUSTER_NAME}-control-plane"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: TinkerbellCluster
metadata:
  name: "${CLUSTER_NAME}"
spec:
  # Cluster-wide Tinkerbell workflow: stream the Talos metal image to the
  # first disk and reboot into it. Talos then fetches its machine config from
  # the Tinkerbell metadata service (see TALOS_IMAGE_URL above).
  templateInline: |
    version: "0.1"
    name: talos
    global_timeout: 6000
    tasks:
      - name: talos
        worker: "{{.device_1}}"
        volumes:
          - /dev:/dev
          - /dev/console:/dev/console
          - /lib/firmware:/lib/firmware:ro
        actions:
          - name: stream-talos-image
            image: quay.io/tinkerbell/actions/image2disk
            timeout: 1200
            environment:
              IMG_URL: ${TALOS_IMAGE_URL:=https://factory.talos.dev/image/376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba/v1.13.10/metal-amd64.raw.xz}
              DEST_DISK: {{ index .Hardware.Disks 0 }}
              COMPRESSED: true
          - name: reboot
            image: ghcr.io/jacobweinstock/waitdaemon:latest
            timeout: 90
            pid: host
            environment:
              IMAGE: quay.io/tinkerbell/actions/reboot
              WAIT_SECONDS: 5
            volumes:
              - /var/run/docker.sock:/var/run/docker.sock
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: TalosControlPlane
metadata:
  name: "${CLUSTER_NAME}-control-plane"
spec:
  version: ${KUBERNETES_VERSION}
  replicas: ${CONTROL_PLANE_MACHINE_COUNT}
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: TinkerbellMachineTemplate
        name: "${CLUSTER_NAME}-control-plane"
  controlPlaneConfig:
    controlplane:
      generateType: controlplane
      talosVersion: ${TALOS_VERSION:=v1.13}
      strategicPatches:
        - |
          machine:
            install:
              disk: ${TALOS_INSTALL_DISK:=/dev/sda}
            kubelet:
              extraArgs:
                provider-id: PROVIDER_ID
            network:
              interfaces:
                - deviceSelector:
                    physical: true
                  dhcp: true
                  vip:
                    ip: ${CONTROL_PLANE_VIP}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: TinkerbellMachineTemplate
metadata:
  name: "${CLUSTER_NAME}-control-plane"
spec:
  template:
    spec:
      hardwareAffinity:
        required:
          - labelSelector:
              matchLabels:
                type: cp
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: "${CLUSTER_NAME}-md-0"
  labels:
    cluster.x-k8s.io/cluster-name: "${CLUSTER_NAME}"
    pool: md-0
spec:
  clusterName: "${CLUSTER_NAME}"
  replicas: ${WORKER_MACHINE_COUNT}
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: "${CLUSTER_NAME}"
      pool: md-0
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: "${CLUSTER_NAME}"
        pool: md-0
    spec:
      version: ${KUBERNETES_VERSION}
      clusterName: "${CLUSTER_NAME}"
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: TalosConfigTemplate
          name: "${CLUSTER_NAME}-md-0"
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: TinkerbellMachineTemplate
        name: "${CLUSTER_NAME}-md-0"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: TinkerbellMachineTemplate
metadata:
  name: "${CLUSTER_NAME}-md-0"
spec:
  template:
    spec:
      hardwareAffinity:
        required:
          - labelSelector:
              matchLabels:
                type: worker
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: TalosConfigTemplate
metadata:
  name: "${CLUSTER_NAME}-md-0"
spec:
  template:
    spec:
      generateType: worker
      talosVersion: ${TALOS_VERSION:=v1.13}
      strategicPatches:
        - |
          machine:
            install:
              disk: ${TALOS_INSTALL_DISK:=/dev/sda}
            kubelet:
              extraArgs:
                provider-id: PROVIDER_ID
