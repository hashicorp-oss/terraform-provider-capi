# Cilium values for a Talos cluster, used as the valuesTemplate of the Cilium
# HelmChartProxy in kairos-bootstrap.tf (CAAPH installs the release on the
# cluster as soon as its control plane is initialized). Pair it with the
# cni-none.yaml Talos patch in every machine config, which turns the built-in
# flannel and kube-proxy off.
#
# Pin the chart version to a tag that exists on the OCI registry
# (oci://quay.io/cilium/charts/cilium). quay keeps only recent patch releases
# (e.g. 1.18.6+), and there is no floating "latest" tag. Check available tags:
#   curl -s https://quay.io/v2/cilium/charts/cilium/tags/list

# --- Talos-required values (from the Talos + Cilium guide); keep these ---
kubeProxyReplacement: true
k8sServiceHost: localhost # KubePrism, enabled by cni-none.yaml
k8sServicePort: 7445
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# --- Everything below is environment-specific: a bare-metal LAN with native ---
# --- routing, BGP and L2 announcements. Trim it to what your network provides. ---
# NOTE: routingMode=native and ipam.mode=cluster-pool both require a pod CIDR.
# Replace 10.244.0.0/16 with your cluster's pod CIDR (it must match
# network.pods.cidr_blocks), or delete these two sections to fall back to the
# default Kubernetes IPAM with tunneling.

# --- Native routing (no overlay); requires L2 adjacency between nodes ---
routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: 10.244.0.0/16
enableIPv4Masquerade: true
bpf:
  masquerade: true
  hostLegacyRouting: true

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.244.0.0/16
    clusterPoolIPv4MaskSize: 24

# --- Load balancing / service exposure on bare metal ---
loadBalancer:
  algorithm: maglev
  mode: snat
externalIPs:
  enabled: true
l2announcements:
  enabled: true
bgpControlPlane:
  enabled: true

# --- Gateway API ---
# Cilium does not bundle the Gateway API CRDs; enabling gatewayAPI without them
# fails with "no matches for kind GatewayClass". Apply the upstream
# standard-install.yaml for the Gateway API release you want as a
# ClusterResourceSet that the Cilium HelmChartProxy depends on, then:
# gatewayAPI:
#   enabled: true
